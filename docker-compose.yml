# ResQKit backend containerization — closes the gap noted in
# ResQKit_Progress_Update.md's overlap table against Matei's existing
# backend, which already had this. Backend + Postgres only: the AI model
# (Ollama) stays host-run and self-hosted, reached via host.docker.internal,
# matching this repo's existing "no data leaves this machine by default"
# posture (see app/backend/.env's APP_AI_BASE_URL comment).
#
# Usage: docker compose up --build
# The backend container reads app/backend/.env for secrets (JWT_SECRET_KEY,
# ADMIN_PASSWORD, APP_AI_KEY) but DATABASE_URL/APP_AI_BASE_URL below
# deliberately override the .env values, which point at 127.0.0.1 — that
# means "the host" from a plain process, but not from inside a container.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resqkit
      POSTGRES_PASSWORD: resqkit_local_pw
      POSTGRES_DB: resqkit_test
    volumes:
      - resqkit_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqkit -d resqkit_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./app/backend
    env_file:
      - ./app/backend/.env
    environment:
      # Override the host-oriented values from .env for the containerized
      # network: "db" is the Postgres service name above, and
      # host.docker.internal reaches Ollama running on the host machine.
      DATABASE_URL: postgresql+asyncpg://resqkit:resqkit_local_pw@db:5432/resqkit_test
      APP_AI_BASE_URL: http://host.docker.internal:11434/v1
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # Needed on Linux Docker Engine for host.docker.internal to resolve;
      # a no-op on Docker Desktop (Windows/Mac), which already provides it.
      - "host.docker.internal:host-gateway"

volumes:
  resqkit_db_data:
